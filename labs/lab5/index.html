<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<div class="labbar"><span>Rowdy CyberCon // Lab 05: SearchBuddy</span><a href="../index.html">&larr; back to labs</a></div>
<header class="app-header"><h1>SearchBuddy</h1></header>
<div class="wrap">
  <div class="panel">
    <form method="get"><label>Search the web</label><input type="text" name="q" autocomplete="off"><button>Search</button></form>
    <div id="results"></div>
  </div>
  <p class="muted">Goal: make this page run <code>alert()</code>.</p>
</div>
<script>
const q = new URLSearchParams(location.search).get('q');
if (q) {
  document.getElementById('results').innerHTML =
    '<p>Showing results for: <b>' + q + '</b></p><p class="muted">No results found.</p>';
}
</script>
</body>
</html>
