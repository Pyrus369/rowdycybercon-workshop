<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemberZone Admin</title>
<link rel="stylesheet" href="../lab.css"><style>:root{--brand:#b45309}</style>
</head>
<body>
<div class="labbar"><span>Rowdy CyberCon // Lab 08: MemberZone</span><a href="../index.html">&larr; back to labs</a></div>
<header class="app-header"><h1>MemberZone Admin</h1><nav><a href="index.html">Home</a></nav></header>
<div class="wrap"><div class="panel" id="panel"></div></div>
<script src="session.js"></script>
<script>
const s = getSession();
const panel = document.getElementById('panel');
const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; panel.appendChild(d); };
if (s.role === 'admin') {
  add('success', 'Welcome to the admin panel, ' + s.user + '.');
  add('flag', atob('UkNDe24zdjNyX3RydXN0X3RoM19jMDBrMTN9'));
} else {
  add('error', '403 Forbidden: admins only. Your role is "' + s.role + '".');
}
</script>
</body>
</html>
