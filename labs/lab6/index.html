<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rowdy Guestbook</title>
<script src="../xss-check.js" data-flag="UkNDe3N0MHIzZF94c3NfcDNyczFzdHN9"></script>
<link rel="stylesheet" href="../lab.css"><style>:root{--brand:#be185d}</style>
</head>
<body>
<div class="labbar"><span>Rowdy CyberCon // Lab 06: Guestbook</span><a href="../index.html">&larr; back to labs</a></div>
<header class="app-header"><h1>Rowdy Guestbook</h1></header>
<div class="wrap">
  <div class="panel">
    <form id="form">
      <label>Name</label><input type="text" id="name" maxlength="50" autocomplete="off">
      <label>Message</label><textarea id="message" rows="3" maxlength="500"></textarea>
      <button>Sign guestbook</button>
      <button type="button" class="secondary" id="clear">Clear entries</button>
    </form>
    <p class="muted">Entries are saved and shown to every visitor of the guestbook.</p>
  </div>
  <div class="panel">
    <h2>Entries</h2>
    <div id="entries"></div>
  </div>
</div>
<script>
const KEY = 'rcc_guestbook';
const seed = [{ name: 'Rowdy', message: 'Welcome to the guestbook! Leave a message.' }];
const load = () => JSON.parse(localStorage.getItem(KEY) || 'null') || seed;
const save = entries => localStorage.setItem(KEY, JSON.stringify(entries.slice(0, 20)));

function render() {
  const box = document.getElementById('entries');
  box.innerHTML = '';
  load().forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';
    const strong = document.createElement('strong');
    strong.textContent = e.name;
    const msg = document.createElement('span');
    msg.innerHTML = ': ' + e.message;
    div.append(strong, msg);
    box.appendChild(div);
  });
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('name').value || 'anonymous';
  const message = document.getElementById('message').value;
  if (!message) return;
  save([{ name, message }, ...load()]);
  location.reload();
});
document.getElementById('clear').addEventListener('click', () => { localStorage.removeItem(KEY); location.reload(); });
render();
</script>
</body>
</html>
