<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBank | Online Banking</title>
<link rel="stylesheet" href="../lab.css"><style>:root{--brand:#1e3a8a}</style>
</head>
<body>
<div class="labbar"><span>Rowdy CyberCon // Lab 02: SecureBank</span><a href="../index.html">&larr; back to labs</a></div>
<header class="app-header"><h1>SecureBank</h1><nav><a href="#">Personal</a><a href="#">Business</a></nav></header>
<div class="wrap narrow">
  <div class="panel">
    <div id="login">
      <h2>Online Banking Login</h2>
      <form id="form">
        <label>Username</label><input type="text" id="username" autocomplete="off">
        <label>Password</label><input type="password" id="password">
        <button>Sign in</button>
      </form>
    </div>
    <div id="result"></div>
    <div id="debug" class="debug hidden"></div>
  </div>
</div>
<script src="../../vendor/sql-wasm.js"></script>
<script src="../sqldb.js"></script>
<script>
const dbReady = makeLabDb();
const el = id => document.getElementById(id);

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const db = await dbReady;
  const u = el('username').value, p = el('password').value;
  // Simulates the vulnerable server-side code: string concatenation into SQL
  const query = "SELECT id, username, role FROM users WHERE username = '" + u + "' AND password = '" + p + "'";
  el('debug').classList.remove('hidden');
  el('debug').innerHTML = '<b>[debug] query executed:</b>\n';
  el('debug').append(query);
  const result = el('result');
  result.innerHTML = '';
  try {
    const rows = db.exec(query);
    const row = rows.length && rows[0].values[0];
    if (!row) {
      result.innerHTML = '<div class="error">Invalid username or password.</div>';
      return;
    }
    el('login').classList.add('hidden');
    const ok = document.createElement('div');
    ok.className = 'success';
    ok.textContent = 'Welcome back, ' + row[1] + ' (role: ' + row[2] + ')';
    result.appendChild(ok);
    const extra = document.createElement('div');
    if (row[2] === 'admin') {
      extra.className = 'flag';
      extra.textContent = atob('UkNDezByXzFfZXF1NGxzXzFfNGx3NHlzfQ==');
    } else {
      extra.className = 'muted';
      extra.textContent = "You're in, but not as an admin. Can you log in as admin?";
    }
    result.appendChild(extra);
    const out = document.createElement('p');
    out.innerHTML = '<a href="">Log out</a>';
    result.appendChild(out);
  } catch (err) {
    const d = document.createElement('div');
    d.className = 'error';
    d.textContent = 'Database error: ' + err.message;
    result.appendChild(d);
  }
});
</script>
</body>
</html>
